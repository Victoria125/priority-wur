name: Spectral and annotation integrity checks

on:
  push:
    branches:
      - fix/annotation-integrity-2026-11-10
      - research/joana-aligned-evidence-gates-2026-11-20
  pull_request:
    paths:
      - 'dreams_molecular_families/scripts/**'
      - 'dreams_molecular_families/tests/**'
      - '.github/workflows/annotation-integrity.yml'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'dreams_molecular_families/tests/requirements-ci.txt'
      - name: Install lightweight QA dependencies
        run: python -m pip install -r dreams_molecular_families/tests/requirements-ci.txt
      - name: Compile Python sources
        run: python -m compileall -q dreams_molecular_families/scripts
      - name: Unit regression tests
        run: python -m unittest discover -s dreams_molecular_families/tests -v
      - name: Public PoDP inventory is not enough for verified linking
        run: |
          python dreams_molecular_families/scripts/linking_evidence.py --dataset MSV000078836 --output /tmp/linking_audit.json
          python -c "import json; x=json.load(open('/tmp/linking_audit.json')); assert x['podp_reported_rows'] >= 1; assert x['ready_for_manual_benchmark_review'] is False; print('Evidence gate correctly rejects uncurated linking')"
