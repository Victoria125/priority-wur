name: Spectral and annotation integrity checks

on:
  push:
    branches:
      - fix/annotation-integrity-2026-11-10
  pull_request:
    paths:
      - 'dreams_molecular_families/scripts/**'
      - 'dreams_molecular_families/tests/**'
      - '.github/workflows/annotation-integrity.yml'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'dreams_molecular_families/tests/requirements-ci.txt'
      - name: Install lightweight QA dependencies
        run: python -m pip install -r dreams_molecular_families/tests/requirements-ci.txt
      - name: Compile Python sources
        run: python -m compileall -q dreams_molecular_families/scripts
      - name: Unit regression tests
        run: python -m unittest discover -s dreams_molecular_families/tests -v
